[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lanyin"
version = "0.2.0"
description = "Prepare serialized audio columns with Markdown chapter parsing, a local episode registry and MiniMax voice-profile locking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL" }]
keywords = ["tts", "podcast", "minimax", "voice-clone", "wechat", "xiaoyuzhou", "ximalaya", "audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "pydantic>=2.7",
  "mutagen>=1.47",
  "markdown-it-py>=3.0",
  "typer>=0.12",
]

[project.scripts]
lanyin = "lanyin.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/lanyin"
Repository = "https://github.com/SuperMarioYL/lanyin"
Issues = "https://github.com/SuperMarioYL/lanyin/issues"

[tool.hatch.build.targets.wheel]
packages = ["lanyin"]

[tool.hatch.build.targets.sdist]
include = ["lanyin", "tests", "README.md", "README.en.md", "LICENSE", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 92
target-version = "py312"
