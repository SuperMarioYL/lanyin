<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：公众号 Markdown + 栏目级音色锁 → LanYin CLI → 章节化 MP3 + 小宇宙/喜马拉雅 RSS">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- persistent column voice lock (feeds the core from above) -->
  <g>
    <rect x="355" y="24" width="170" height="58" rx="14" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5" stroke-dasharray="4 4">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#8985FF">栏目级音色锁</text>
    <text x="440" y="68" text-anchor="middle" font-size="11" fill="#A1A1A8">voice-lock.json · 跨期复用</text>
  </g>

  <!-- connectors: static base lines -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="310" y2="180" marker-end="url(#ah-d)"/>
    <line x1="525" y1="180" x2="625" y2="180" marker-end="url(#ah-d)"/>
    <line x1="440" y1="82" x2="440" y2="132" marker-end="url(#ah-d)"/>
  </g>
  <!-- marching dashes: data flow (direction = real data direction) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="306" y2="180" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="180" x2="621" y2="180" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="82" x2="440" y2="128" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packet dots -->
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M210,180 L306,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M525,180 L621,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M440,82 L440,128" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes (row) -->
  <g>
    <rect x="40"  y="140" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">公众号 Markdown</text>
    <text x="125" y="200" text-anchor="middle" font-size="11" fill="#A1A1A8">连载栏目 · ## 章节</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">LanYin CLI</text>
    <text x="440" y="194" text-anchor="middle" font-size="11" fill="#A1A1A8">chapter · voice-lock · TTS</text>
    <text x="440" y="210" text-anchor="middle" font-size="11" fill="#A1A1A8">synth · export rss</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">章节化 MP3 + RSS</text>
    <text x="755" y="200" text-anchor="middle" font-size="11" fill="#A1A1A8">ID3 CHAP · 小宇宙/喜马拉雅</text>
  </g>
</svg>
